# Example: Mimesis synthetic data generation to Parquet
# This example demonstrates how to generate synthetic customer data using Mimesis
# and write it to Parquet files

tenant_id: acme
environment: dev

# Source connector
source_connector: mimesis
source_connector_path: connectors/examples/mimesis.yaml

# Target connector
target_connector: iceberg
target_connector_path: connectors/examples/iceberg.yaml

# Asset definition
asset: mimesis_customers
asset_path: configs/assets/mimesis_customers.yaml

# Source configuration
source:
  type: mimesis
  object: customers
  engine:
    type: native
    options:
      native:
        row_count: 1000  # Number of rows to generate (default: 1000)

# Target configuration
target:
  type: iceberg
  connection:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucket: "${S3_BUCKET}"
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      region: "${AWS_REGION}"
      path_style_access: true  # Set to true for MinIO
  catalog: nessie  # Optional: omit for S3-only writes
  branch: main
  partitioning: [ingest_date]

# Execution configuration
schema_validation_mode: warn

# Logging configuration
logging:
  redaction: false
  level: INFO
