$schema: ../../schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: employees
version: "1.0"
domain: hr  # Optional: organizational domain (e.g., hr, finance, sales)
dataProduct: employee_management  # Optional: logical data product grouping
source_type: csv
object: employees
schema:
  - name: id
    type: integer
    required: true
  - name: name
    type: string
    required: true
  - name: email
    type: string
    required: true
  - name: department
    type: string
  - name: salary
    type: integer
target:
  file_format: parquet
  partitioning: [ingest_date]
team:
  owner: test@example.com
compliance:
  classification: []
