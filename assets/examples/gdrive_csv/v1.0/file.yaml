$schema: schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: gdrive_csv_file
version: "1.0"
source_type: gdrive_csv
object: file

schema:
  - name: id
    type: string
    required: true
  - name: name
    type: string
    required: false
  - name: modifiedTime
    type: timestamp
    required: false
  - name: size
    type: string
    required: false

team:
  owner: data-team@company.com

tags: [files, gdrive]

compliance:
  classification: []
  retention_days: 90

target:
  file_format: parquet
  partitioning: [ingest_date]
  mode: strict
