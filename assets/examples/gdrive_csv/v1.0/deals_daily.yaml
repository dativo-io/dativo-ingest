$schema: schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: gdrive_deals_daily
version: "1.0"
source_type: gdrive_csv
object: deals_daily

schema:
  - name: deal_id
    type: string
    required: true
  - name: amount
    type: double
    required: false
  - name: closed_at
    type: timestamp
    required: false

team:
  owner: data-team@company.com

tags: [deals, sales]

compliance:
  retention_days: 30

target:
  file_format: parquet
  partitioning: [ingest_date]
  mode: strict
