$schema: ../../schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: products
version: "1.0"
source_type: csv
object: products
schema:
  - name: product_id
    type: integer
    required: true
  - name: product_name
    type: string
    required: true
  - name: price
    type: decimal
    required: true
  - name: category
    type: string
    required: true
  - name: in_stock
    type: boolean
target:
  file_format: parquet
  partitioning: []
team:
  owner: test@example.com
compliance:
  classification: []
