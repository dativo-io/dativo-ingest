$schema: schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: csv_person
version: "1.0"
source_type: csv
object: Person

schema:
  - name: BusinessEntityID
    type: integer
    required: true
  - name: PersonType
    type: string
    required: true
  - name: NameStyle
    type: integer
    required: false
  - name: Title
    type: string
    required: false
  - name: FirstName
    type: string
    required: true
  - name: MiddleName
    type: string
    required: false
  - name: LastName
    type: string
    required: true
  - name: Suffix
    type: string
    required: false
  - name: EmailPromotion
    type: integer
    required: false
  - name: AdditionalContactInfo
    type: string
    required: false
  - name: Demographics
    type: string
    required: false
  - name: rowguid
    type: string
    required: true
  - name: ModifiedDate
    type: timestamp
    required: true

team:
  owner: data-team@company.com

tags: [adventureworks, person, test-data]

compliance:
  retention_days: 90

target:
  file_format: parquet
  partitioning: [ingest_date]
  mode: strict
