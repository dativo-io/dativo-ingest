$schema: ../../schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: stripe_invoices
version: "1.0"
source_type: stripe
object: invoices
schema:
  - name: id
    type: string
    required: true
  - name: customer
    type: string
    required: false
  - name: amount_due
    type: integer
    required: false
  - name: currency
    type: string
    required: false
  - name: status
    type: string
    required: false
  - name: created
    type: timestamp
    required: true
target:
  file_format: parquet
  partitioning: [ingest_date]
team:
  owner: data-team@company.com
compliance:
  classification: []
  retention_days: 365
tags: [payments, invoices]
