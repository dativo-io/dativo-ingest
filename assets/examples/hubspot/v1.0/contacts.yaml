$schema: schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: hubspot_contacts
version: "1.0"
source_type: hubspot
object: contacts

schema:
  - name: id
    type: string
    required: true
  - name: email
    type: string
    required: false
    classification: PII
  - name: updatedAt
    type: timestamp
    required: true

team:
  owner: data-team@company.com

tags: [crm, contacts]

compliance:
  classification: [PII]
  retention_days: 30

target:
  file_format: parquet
  partitioning: [ingest_date]
  mode: strict
