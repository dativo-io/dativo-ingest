$schema: schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: hubspot_deals
version: "1.0"
source_type: hubspot
object: deals

schema:
  - name: id
    type: string
    required: true
  - name: dealName
    type: string
    required: false
  - name: amount
    type: decimal
    required: false
  - name: dealStage
    type: string
    required: false
  - name: closeDate
    type: timestamp
    required: false
  - name: updatedAt
    type: timestamp
    required: true

team:
  owner: data-team@company.com

tags: [crm, deals]

compliance:
  classification: []
  retention_days: 90

target:
  file_format: parquet
  partitioning: [ingest_date]
  mode: strict
