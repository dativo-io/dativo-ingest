$schema: schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: hubspot_companies
version: "1.0"
source_type: hubspot
object: companies

schema:
  - name: id
    type: string
    required: true
  - name: name
    type: string
    required: false
  - name: domain
    type: string
    required: false
  - name: industry
    type: string
    required: false
  - name: updatedAt
    type: timestamp
    required: true

team:
  owner: data-team@company.com

tags: [crm, companies]

compliance:
  classification: []
  retention_days: 90

target:
  file_format: parquet
  partitioning: [ingest_date]
  mode: strict
