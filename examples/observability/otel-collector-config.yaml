# OpenTelemetry Collector configuration for Dativo-Ingest metrics
# Receives metrics via OTLP and exports to multiple backends

receivers:
  # OTLP receiver for metrics from Dativo-Ingest
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor to reduce number of export requests
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Resource processor to add environment attributes
  resource:
    attributes:
      - key: service.environment
        value: production
        action: upsert
      - key: service.instance.id
        value: ${env:HOSTNAME}
        action: upsert

  # Memory limiter to prevent OOM
  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  # Export to Prometheus (for scraping)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: dativo
    send_timestamps: true
    metric_expiration: 5m

  # Export to Grafana Cloud (optional)
  # prometheusremotewrite:
  #   endpoint: https://prometheus-prod-01-eu-west-0.grafana.net/api/prom/push
  #   headers:
  #     Authorization: "Bearer <YOUR_GRAFANA_API_TOKEN>"

  # Export to AWS CloudWatch (optional)
  # awscloudwatch:
  #   namespace: DativoIngest
  #   region: us-east-1
  #   metric_descriptors:
  #     - metric_name: '*'
  #       unit: Count
  #       overwrite: true

  # Logging exporter (for debugging)
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200

  # Export to DataDog (optional)
  # datadog:
  #   api:
  #     key: ${env:DD_API_KEY}
  #     site: datadoghq.com

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133

  # Performance profiler (optional)
  pprof:
    endpoint: 0.0.0.0:1777

  # zPages for debugging (optional)
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, pprof, zpages]
  
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, logging]
      
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      address: 0.0.0.0:8888
