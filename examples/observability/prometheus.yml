# Prometheus configuration for scraping Dativo-Ingest metrics
# Updated for canonical metric names (dativo_ingest_*)

global:
  scrape_interval: 30s      # How frequently to scrape targets
  scrape_timeout: 10s       # How long until a scrape request times out
  evaluation_interval: 30s  # How frequently to evaluate rules

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"
  # - "recording_rules.yml"

# Scrape configurations
scrape_configs:
  # Dativo-Ingest metrics endpoint
  - job_name: 'dativo-ingest'
    static_configs:
      - targets: ['dativo-ingest:9400']  # Use service name in Docker
        labels:
          environment: 'development'
          service: 'dativo-ingest'
    scrape_interval: 30s
    scrape_timeout: 10s
    
    # Optional: Use service discovery for Kubernetes
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces:
    #       names:
    #         - dativo
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     regex: dativo-ingest
    #     action: keep
    #   - source_labels: [__meta_kubernetes_pod_container_port_number]
    #     regex: "9400"
    #     action: keep

  # Optional: OTEL Collector Prometheus exporter
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s

  # Optional: Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
