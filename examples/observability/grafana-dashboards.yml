# Grafana dashboard provisioning
# Automatically loads dashboards on startup

apiVersion: 1

providers:
  - name: 'Dativo Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
