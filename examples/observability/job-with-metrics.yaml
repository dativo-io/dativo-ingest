# Job configuration with metrics override
# This example shows how to override metrics configuration per-job

tenant_id: acme
environment: production

# Connector paths
source_connector_path: /app/connectors/stripe.yaml
target_connector_path: /app/connectors/s3_iceberg.yaml
asset_path: /app/assets/stripe_payments.yaml

# Source configuration
source:
  connection:
    api_key: ${STRIPE_API_KEY}
  incremental:
    enabled: true
    cursor_field: created
    state_path: /app/state/stripe_payments.json

# Target configuration
target:
  connection:
    s3:
      bucket: ${S3_BUCKET}
      endpoint: ${S3_ENDPOINT}
  catalog: nessie
  branch: main

# Metrics configuration (optional - overrides runner config)
metrics:
  enabled: true
  
  # Enable Prometheus for this job (even in oneshot mode)
  prometheus:
    enabled: true
    port: 9400
  
  # Enable OTEL for this specific job
  otel:
    enabled: true
    protocol: grpc
    endpoint: http://custom-collector:4317
  
  # Override label configuration
  labels:
    include_tenant_id: true  # Enable for this job
    include_job_name: true   # Enable for this job
