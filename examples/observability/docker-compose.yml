# Docker Compose setup for Dativo-Ingest with full observability stack
# Includes: Dativo-Ingest, Prometheus, Grafana, OTEL Collector

version: '3.8'

services:
  # Dativo-Ingest in orchestrated mode with metrics enabled
  dativo-ingest:
    image: dativo/dativo-ingest:latest
    container_name: dativo-ingest
    command: dativo start orchestrated --runner-config /app/configs/runner.yaml
    environment:
      # Metrics configuration
      - DATIVO_METRICS_PROMETHEUS=true
      - DATIVO_METRICS_PORT=9400
      - DATIVO_METRICS_HOST=0.0.0.0
      - DATIVO_METRICS_OTEL=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - DATIVO_ENVIRONMENT=development
      
      # Storage configuration
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=dativo-data
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      
      # Database configuration
      - NESSIE_URI=http://nessie:19120/api/v1
    volumes:
      - ./configs:/app/configs
      - ./jobs:/app/jobs
      - ./secrets:/secrets
    ports:
      - "9400:9400"  # Metrics endpoint
    depends_on:
      - otel-collector
      - minio
      - nessie
    networks:
      - dativo-network

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
      - "13133:13133" # Health check
      - "55679:55679" # zPages
    networks:
      - dativo-network

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dativo-network
    depends_on:
      - dativo-ingest

  # Grafana
  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/dativo.json
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - dativo-network
    depends_on:
      - prometheus

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dativo-network

  # Nessie Catalog
  nessie:
    image: projectnessie/nessie:0.76.0
    container_name: nessie
    environment:
      - QUARKUS_HTTP_PORT=19120
    ports:
      - "19120:19120"
    networks:
      - dativo-network

volumes:
  prometheus-data:
  grafana-data:
  minio-data:

networks:
  dativo-network:
    driver: bridge
