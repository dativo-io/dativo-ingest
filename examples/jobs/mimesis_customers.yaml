# Mimesis Synthetic Customers Example Job
# This job generates synthetic customer data and writes it to Iceberg/Parquet
tenant_id: demo_tenant
environment: production

# Source connector
source_connector: mimesis
source_connector_path: connectors/examples/mimesis.yaml

# Target connector
target_connector: iceberg
target_connector_path: connectors/examples/iceberg.yaml

# Asset definition
asset: mimesis_customers
asset_path: tests/fixtures/assets/mimesis/v1.0/customers.yaml

# Source configuration
source:
  type: mimesis
  engine:
    options:
      row_count: 10000  # Generate 10,000 customers
      batch_size: 1000
      locale: "en"
      seed: null  # Random data each time

# Target configuration
target:
  connection:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucket: "${S3_BUCKET}"
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      region: "${AWS_REGION}"
      path_style_access: true

# Execution configuration
schema_validation_mode: strict

# Logging configuration
logging:
  redaction: false
  level: INFO
