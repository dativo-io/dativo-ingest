# HubSpot connector - source only
name: hubspot
type: hubspot
roles: [source]  # Source only - API connector
description: "HubSpot connector"
default_engine:
  type: airbyte
  options:
    airbyte:
      docker_image: "airbyte/source-hubspot:6.0.15"
      streams_default: ["contacts", "deals", "companies"]
      start_date_default: "2024-01-01"
credentials:
  type: oauth
  # Airbyte HubSpot 6.0.15+ supports both OAuth and Private App authentication
  # 
  # Option 1: Private App (simpler, recommended for testing)
  # - HUBSPOT_API_KEY or HUBSPOT_ACCESS_TOKEN: Private App access token (pat-*)
  #
  # Option 2: OAuth (for production with refresh tokens)
  # - HUBSPOT_CLIENT_ID: OAuth client ID from HubSpot OAuth app
  # - HUBSPOT_OAUTH_CLIENT_SECRET: OAuth client secret from HubSpot OAuth app
  # - HUBSPOT_REFRESH_TOKEN: OAuth refresh token (obtained through OAuth authorization flow)
  from_env: HUBSPOT_API_KEY
incremental:
  # Strategy: semantic name indicating type of incremental sync (created, updated_after, updated_at)
  # These strategies require a cursor_field to be specified
  strategy: updated_after
  # cursor_field_default: actual API field name from HubSpot API (see https://developers.hubspot.com/docs/api)
  # For HubSpot, the 'updatedAt' field (camelCase) is used for incremental sync
  # This default is automatically converted to 'cursor_field' when merging with job config
  cursor_field_default: updatedAt
  lookback_days_default: 1
rate_limits:
  rps_default: 4
  burst_default: 8
  retry:
    max_retries: 5
    backoff: exponential
    max_backoff_seconds: 64

