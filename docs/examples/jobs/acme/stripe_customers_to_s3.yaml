# Stripe customers to S3 job for tenant acme
tenant_id: acme
environment: prod

source_connector: stripe
source_connector_path: /app/connectors/examples/stripe.yaml

target_connector: s3
target_connector_path: /app/connectors/examples/s3.yaml

asset: stripe_customers
asset_path: /app/assets/stripe/v1.0/customers.yaml

source:
  object: customers
  incremental:
    lookback_days: 1

target:
  connection:
    bucket: "acme-data-lake"

logging:
  redaction: true
  level: INFO

