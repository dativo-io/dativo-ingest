$schema: ../../schemas/odcs/dativo-odcs-3.0.2-extended.schema.json
apiVersion: v3.0.2
kind: DataContract
name: stripe_customers
version: "1.0"
source_type: stripe
object: customers
schema:
  # Long-term: Updated schema to match Airbyte Stripe customer output
  - name: id
    type: string
    required: true
  - name: object
    type: string
    required: false
  - name: address
    type: string
    required: false
  - name: balance
    type: double
    required: false
  - name: created
    type: timestamp
    required: true
  - name: currency
    type: string
    required: false
  - name: default_source
    type: string
    required: false
  - name: delinquent
    type: boolean
    required: false
  - name: description
    type: string
    required: false
  - name: discount
    type: string
    required: false
  - name: email
    type: string
    required: false
    classification: PII
  - name: invoice_prefix
    type: string
    required: false
  - name: invoice_settings
    type: string
    required: false
  - name: livemode
    type: boolean
    required: false
  - name: metadata
    type: string
    required: false
  - name: name
    type: string
    required: false
  - name: next_invoice_sequence
    type: integer
    required: false
  - name: phone
    type: string
    required: false
    classification: PII
  - name: preferred_locales
    type: string
    required: false
  - name: shipping
    type: string
    required: false
  - name: tax_exempt
    type: string
    required: false
  - name: test_clock
    type: string
    required: false
target:
  file_format: parquet
  partitioning: [ingest_date]
team:
  owner: data-team@company.com
compliance:
  classification: [PII]
  retention_days: 30
  regulations: [PCI-DSS, GDPR]
finops:
  cost_center: FIN-001
  business_tags: [payments, revenue]
  project: payment-platform
  environment: production
