# Mimesis Performance Test Data Generation
# Replacement for tests/scripts/generate_perf_test_data.py
# Generates large synthetic dataset for performance testing
tenant_id: perf_test_tenant
environment: test

# Source connector
source_connector: mimesis
source_connector_path: connectors/examples/mimesis.yaml

# Target connector - write to Iceberg/Parquet
target_connector: iceberg
target_connector_path: connectors/examples/iceberg.yaml

# Asset definition
asset: mimesis_perf_test_data
asset_path: tests/fixtures/assets/mimesis/v1.0/perf_test_data.yaml

# Source configuration
source:
  type: mimesis
  engine:
    options:
      row_count: 1000000  # Generate 1 million rows for performance testing
      batch_size: 10000   # Process in 10k batches for efficiency
      locale: "en"
      seed: 42  # For reproducible performance tests

# Target configuration - Iceberg table configuration
target:
  connection:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucket: test-bucket
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      region: "${AWS_REGION}"
      path_style_access: true

# Execution configuration
schema_validation_mode: warn  # Use warn for performance tests

# Logging configuration
logging:
  redaction: false
  level: INFO
