# CSV Employee to Iceberg job with WAL checkpointing for smoke tests
tenant_id: test_tenant
environment: test

# Source connector
source_connector: csv
source_connector_path: connectors/csv.yaml

# Target connector
target_connector: iceberg
target_connector_path: connectors/iceberg.yaml

# Asset definition
asset: csv_employee
asset_path: tests/fixtures/assets/csv/v1.0/employee.yaml

# Source configuration with WAL enabled
source:
  files:
    - path: tests/fixtures/seeds/employee/Employee_Complete_Dataset.csv
  engine:
    options:
      native:
        chunk_size: 100  # Small chunks to test checkpointing
      encoding: "utf-8"
  wal:
    enabled: true
    base_dir: tests/fixtures/wal  # Use test-specific WAL directory

# Target configuration - Iceberg table configuration
target:
  connection:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucket: test-bucket
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      region: "${AWS_REGION}"
      path_style_access: true

# Execution configuration
schema_validation_mode: warn

# Logging configuration
logging:
  redaction: false
  level: INFO

