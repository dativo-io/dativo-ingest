# Performance Test 4: Iceberg Table -> CSV Writer (Rust)
# Tests: Reading Parquet files from Iceberg table and writing as CSV with Rust writer
# Note: Currently uses Python CSV writer (Rust CSV writer can be added later)
tenant_id: perf_test_tenant
environment: test

source_connector: s3
source_connector_path: connectors/examples/s3.yaml

target_connector: s3
target_connector_path: connectors/examples/s3.yaml

asset: perf_test_data
asset_path: tests/fixtures/assets/csv/v1.0/perf_test_data.yaml

source:
  connection:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucket: test-bucket
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      region: "${AWS_REGION}"
      path_style_access: true
  files:
    - path: "perf_test_db/test2_csv_rust/data"
      object: perf_test_data
  engine:
    options:
      file_format: parquet
      batch_size: 100000

target:
  custom_writer: "tests/fixtures/plugins/csv_writer.py:CSVWriter"
  connection:
    s3:
      endpoint: "${S3_ENDPOINT}"
      bucket: test-bucket
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
      region: "${AWS_REGION}"
      path_style_access: true
  engine:
    options:
      delimiter: ","
      include_header: true

schema_validation_mode: warn
logging:
  redaction: false
  level: INFO
